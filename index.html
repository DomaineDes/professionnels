<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domaine Desvignes — Espace professionnel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .box { text-align:center; padding: 1.5rem; }
  .box h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); color: var(--wine); margin-bottom: 2rem; }
  .langs { display:flex; gap:1rem; justify-content:center; flex-wrap: wrap; }
  .langs a {
    padding:0.9rem 2.2rem; background: var(--wine); color: var(--stone);
    text-decoration:none; font-family:'Cormorant Garamond',serif; font-size:1.2rem;
  }
  .langs a:hover { background: var(--olive); }

  #gate { display:flex; flex-direction:column; align-items:center; gap:1rem; }
  #gate input {
    font-family: 'Inter', sans-serif;
    font-size: 1.1rem;
    padding: 0.7rem 1rem;
    border: 1px solid #D9D0BF;
    text-align: center;
    width: 12rem;
    letter-spacing: 0.15em;
  }
  #gate button {
    padding: 0.7rem 2rem;
    background: var(--wine);
    color: var(--stone);
    border: none;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    cursor: pointer;
  }
  #gate button:hover { background: var(--olive); }
  #gateError { color: var(--wine); font-size: 0.85rem; min-height: 1.2em; }
</style>
</head>
<body>
  <div class="box">
    <h1>Domaine Desvignes</h1>

    <div id="gate">
      <input type="text" inputmode="numeric" id="codeInput" placeholder="Code d'accès" maxlength="12" autofocus>
      <button onclick="checkCode()">Valider</button>
      <div id="gateError"></div>
    </div>

    <div class="langs" id="langs" style="display:none;">
      <a href="accueil-fr.html">Français</a>
      <a href="accueil-en.html">English</a>
    </div>
  </div>

  <script>
    const ACCESS_CODE = "467294";

    function unlock() {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('langs').style.display = 'flex';
    }

    function checkCode() {
      const val = document.getElementById('codeInput').value.trim();
      if (val === ACCESS_CODE) {
        sessionStorage.setItem('dd_access', 'ok');
        unlock();
      } else {
        document.getElementById('gateError').textContent = "Code incorrect.";
      }
    }

    document.getElementById('codeInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') checkCode();
    });

    // Reste déverrouillé pendant la session du navigateur (pas besoin de retaper le code à chaque page)
    if (sessionStorage.getItem('dd_access') === 'ok') unlock();
  </script>
</body>
</html>
